[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/chibichara/supervisord.pid

[program:irodori]
command=/usr/bin/python3 /opt/chibichara/docker/run_service.py irodori
directory=/opt/chibichara
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:toonout]
command=/usr/bin/python3 /opt/chibichara/docker/run_service.py toonout
directory=/opt/chibichara
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:movie]
command=/usr/bin/python3 /opt/chibichara/docker/run_service.py movie
directory=/opt/chibichara
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
# Movie waits for in-flight TTS requests when shutting down. Stop it first,
# while the lower-priority Irodori process is still available.
stopwaitsecs=960
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
